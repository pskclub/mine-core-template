version: 2
updates:
  # Includes github.com/pskclub/mine-core/v2: a bump PR here runs the whole
  # template against the new framework release, which makes this repository an
  # early warning for breaking changes as well as a template.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
